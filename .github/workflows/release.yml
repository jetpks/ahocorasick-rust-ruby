name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_native:
    name: Build native gem (${{ matrix.ruby-platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-platform:
          - arm64-darwin
          - x86_64-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-gnu
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: oxidize-rb/actions/setup-ruby-and-rust@main
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cargo-cache: sccache

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.ruby-platform }}
          ruby-versions: "4.0, 3.4"
          tag: "0.9.124"

      - name: Upload cross-compiled gems
        uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.ruby-platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  build_source:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oxidize-rb/actions/setup-ruby-and-rust@main
        with:
          ruby-version: "4.0"
          bundler-cache: false
          cargo-cache: sccache

      - name: Build source gem
        run: |
          gem build ahocorasick-rust.gemspec
          mkdir -p pkg/
          mv *.gem pkg/

      - name: Upload source gem
        uses: actions/upload-artifact@v4
        with:
          name: source-gem
          path: pkg/

  publish:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    needs:
      - build_native
      - build_source
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # OIDC token for RubyGems trusted publishing
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          path: pkg/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: source-gem
          path: pkg/

      - name: Display structure of downloaded gems
        run: ls -R pkg/

      # Trusted publishing: no API key, no OTP — a short-lived OIDC
      # credential minted at run time, scoped to this repo + workflow
      # (rubygems.org trusted publisher: jetpks/ahocorasick-rust-ruby,
      # .github/workflows/release.yml). Replaces the RUBYGEM_TOKEN API
      # key, which rubygems MFA now gates with an interactive OTP prompt
      # CI can never answer.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish gems to RubyGems
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Extract version number from tag (v1.0.2 -> 1.0.2)
          VERSION_NUMBER="${VERSION#v}"

          cd pkg
          for gem_file in ahocorasick-rust-${VERSION_NUMBER}*.gem; do
            echo "Publishing ${gem_file}..."
            gem push "${gem_file}"
          done

      - name: Test installation
        run: |
          gem install ahocorasick-rust --verbose
          ruby -rahocorasick-rust -e "puts AhoCorasickRust.new(['foo', 'bar']).lookup('Foolish men play football in bar');"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.gem
          generate_release_notes: true
